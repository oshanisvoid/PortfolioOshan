[[redirects]]
  from = "/projects/"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/guestbook/"
  to = "/guestbook.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/not-found.html"
