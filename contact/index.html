<body>

  <div class="container">
    <a class="logo" href="/" aria-label="Oshan Paudel home">Oshan.Codes</a>
    <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">

<li><a href="/projects">Projects</a></li>
<li><a href="/contact" class="active-nav">Contact</a></li>
<li><a href="/guestbook">Guestbook</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">

<section class="page-hero">
  <h1>Contact</h1>
  <p>Have a project, collaboration idea, or technical question? Send me a message.</p>
</section>

<section class="content-section">
  <div class="form-card">
    <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p class="hidden">
        <label>Do not fill this out if you are human: <input name="bot-field" /></label>
      </p>

      <div class="form-group">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required />
      </div>

      <div class="form-group">
        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="160" required />
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" minlength="10" maxlength="3000" required></textarea>
      </div>

      <button class="button primary" type="submit" id="contact-submit">
        <i class="fas fa-paper-plane"></i> Send Message
      </button>
      <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="social-links">
    <a href="mailto:contactoshan0@gmail.com"><i class="fas fa-envelope"></i> Email</a>
    <a href="https://github.com/oshanisvoid" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
    <a href="https://discord.com/" target="_blank" rel="noopener"><i class="fab fa-discord"></i> Discord</a>
    <a href="https://www.linkedin.com/" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i> LinkedIn</a>
  </div>
</section>

</main>
