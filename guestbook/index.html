<body>
<header class="navbar">
  <div class="container">
    <a class="logo" href="/" aria-label="Oshan Paudel home">Oshan.Codes</a>
    <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>
    <nav class="nav-links-container" aria-label="Primary navigation">
      <ul class="nav-links">
        <li><a href="/about">About</a></li>
<li><a href="/projects">Projects</a></li>
<li><a href="/contact">Contact</a></li>
<li><a href="/guestbook" class="active-nav">Guestbook</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">

<section class="page-hero">
  <h1>Guestbook</h1>
  <p>Sign in with Google, leave a message, and see what everyone has written.</p>
</section>

<section class="content-section">
  <div class="form-card">
    <div id="guest-signed-out">
      <h2 style="margin-top:0;">Sign in to write</h2>
      <p>Use your Google account to sign the guestbook.</p>
      <button class="button primary" type="button" id="google-login">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <p class="form-status" id="auth-status" role="status" aria-live="polite"></p>
    </div>

    <div id="guest-signed-in" class="hidden">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
        <img id="guest-avatar" src="" alt="" style="width:48px;height:48px;border-radius:50%;border:1px solid var(--border-color);object-fit:cover;">
        <div>
          <strong id="guest-user-name"></strong>
          <div><small id="guest-user-email" style="color:var(--light-text);"></small></div>
        </div>
      </div>

      <form id="guestbook-form">
        <div class="form-group">
          <label for="guest-message">Your message</label>
          <textarea id="guest-message" name="message" minlength="2" maxlength="500" required placeholder="Write something..."></textarea>
        </div>
        <button class="button primary" type="submit" id="guestbook-submit">
          <i class="fas fa-signature"></i> Sign Guestbook
        </button>
        <button class="button" type="button" id="google-logout">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
        <p class="form-status" id="guestbook-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div class="guestbook-list" id="guestbook-list" aria-live="polite">
    <p class="loading-state">Loading guestbook messages...</p>
  </div>
</section>

</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2026 Oshan Paudel. All rights reserved.</p>
  </div>
</footer>

<script type="module" src="/guestbook-auth.js"></script>
<script src="/script.js" defer></script>
</body>
</html>
